services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: aieo
      POSTGRES_USER: aieo
      POSTGRES_PASSWORD: aieo
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/001_phase2_knowledge.sql:/docker-entrypoint-initdb.d/001_phase2_knowledge.sql:ro
      - ./migrations/002_phase2_executions.sql:/docker-entrypoint-initdb.d/002_phase2_executions.sql:ro
      - ./migrations/003_phase2_mcp_audit.sql:/docker-entrypoint-initdb.d/003_phase2_mcp_audit.sql:ro
      - ./migrations/004_phase4_evidence_audit.sql:/docker-entrypoint-initdb.d/004_phase4_evidence_audit.sql:ro
      - ./migrations/005_repository_knowledge.sql:/docker-entrypoint-initdb.d/005_repository_knowledge.sql:ro
      - ./migrations/006_semantic_knowledge.sql:/docker-entrypoint-initdb.d/006_semantic_knowledge.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aieo -d aieo"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      AIEO_ENVIRONMENT: ${AIEO_ENVIRONMENT:-development}
      AIEO_LOG_LEVEL: ${AIEO_LOG_LEVEL:-INFO}
      AIEO_DEMO_MODE: ${AIEO_DEMO_MODE:-true}
      AIEO_DATABASE_URL: ${AIEO_DATABASE_URL:-postgresql+psycopg://aieo:aieo@postgres:5432/aieo}
      AIEO_LLM_PROVIDER: ${AIEO_LLM_PROVIDER:-simulated}
      AIEO_EMBEDDING_PROVIDER: ${AIEO_EMBEDDING_PROVIDER:-deterministic}
      AIEO_EMBEDDING_MODEL: ${AIEO_EMBEDDING_MODEL:-text-embedding-3-small}
      AIEO_EMBEDDING_DIMENSIONS: ${AIEO_EMBEDDING_DIMENSIONS:-16}
      AIEO_EMBEDDING_BATCH_SIZE: ${AIEO_EMBEDDING_BATCH_SIZE:-32}
      AIEO_EMBEDDING_TIMEOUT_SECONDS: ${AIEO_EMBEDDING_TIMEOUT_SECONDS:-30}
      AIEO_REPOSITORY_INGESTION_TIMEOUT_SECONDS: ${AIEO_REPOSITORY_INGESTION_TIMEOUT_SECONDS:-120}
      AIEO_LLM_MODEL: ${AIEO_LLM_MODEL:-gpt-6-astra}
      AIEO_LLM_PLANNING_ENABLED: ${AIEO_LLM_PLANNING_ENABLED:-true}
      AIEO_LLM_TIMEOUT_SECONDS: ${AIEO_LLM_TIMEOUT_SECONDS:-60}
      AIEO_LLM_STORE_RESPONSES: ${AIEO_LLM_STORE_RESPONSES:-false}
      AIEO_LLM_TRACING_ENABLED: ${AIEO_LLM_TRACING_ENABLED:-false}
      AIEO_MAX_LLM_INPUT_TOKENS: ${AIEO_MAX_LLM_INPUT_TOKENS:-4000}
      AIEO_MAX_LLM_OUTPUT_TOKENS: ${AIEO_MAX_LLM_OUTPUT_TOKENS:-1000}
      AIEO_MAX_RAG_CONTEXT_TOKENS: ${AIEO_MAX_RAG_CONTEXT_TOKENS:-1200}
      AIEO_TELEMETRY_ENABLED: ${AIEO_TELEMETRY_ENABLED:-true}
      AIEO_METRICS_ENABLED: ${AIEO_METRICS_ENABLED:-true}
      AIEO_API_AUTH_ENABLED: ${AIEO_API_AUTH_ENABLED:-false}
      AIEO_MAX_STEPS: ${AIEO_MAX_STEPS:-12}
      AIEO_AGENT_TIMEOUT_SECONDS: ${AIEO_AGENT_TIMEOUT_SECONDS:-5}
      AIEO_MAX_RETRIES: ${AIEO_MAX_RETRIES:-1}
      AIEO_GITHUB_EVIDENCE_TIMEOUT_SECONDS: ${AIEO_GITHUB_EVIDENCE_TIMEOUT_SECONDS:-10}
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  migrate:
    build: .
    command: ["python", "-m", "ai_engineering.infrastructure.migrations"]
    environment:
      AIEO_DATABASE_URL: ${AIEO_DATABASE_URL:-postgresql+psycopg://aieo:aieo@postgres:5432/aieo}
      AIEO_MIGRATIONS_DIR: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

volumes:
  postgres-data:
