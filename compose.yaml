services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: aieo
      POSTGRES_USER: aieo
      POSTGRES_PASSWORD: aieo
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/001_phase2_knowledge.sql:/docker-entrypoint-initdb.d/001_phase2_knowledge.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aieo -d aieo"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      AIEO_ENVIRONMENT: development
      AIEO_DEMO_MODE: "true"
      AIEO_DATABASE_URL: postgresql+psycopg://aieo:aieo@postgres:5432/aieo
      AIEO_LLM_PROVIDER: simulated
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  postgres-data:

