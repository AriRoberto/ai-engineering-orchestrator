services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      AIEO_ENVIRONMENT: development
      AIEO_DEMO_MODE: "true"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

