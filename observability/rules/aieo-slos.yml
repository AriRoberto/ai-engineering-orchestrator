groups:
  - name: ai-engineering-orchestrator-sli
    interval: 30s
    rules:
      - record: aieo:sli_availability:ratio_rate5m
        expr: |
          1 - (
            sum(rate(aieo_http_server_requests_total{http_response_status_code=~"5.."}[5m]))
            / clamp_min(sum(rate(aieo_http_server_requests_total[5m])), 0.001)
          )
      - record: aieo:sli_availability:ratio_rate30m
        expr: |
          1 - (
            sum(rate(aieo_http_server_requests_total{http_response_status_code=~"5.."}[30m]))
            / clamp_min(sum(rate(aieo_http_server_requests_total[30m])), 0.001)
          )
      - record: aieo:sli_availability:ratio_rate1h
        expr: |
          1 - (
            sum(rate(aieo_http_server_requests_total{http_response_status_code=~"5.."}[1h]))
            / clamp_min(sum(rate(aieo_http_server_requests_total[1h])), 0.001)
          )
      - record: aieo:sli_availability:ratio_rate6h
        expr: |
          1 - (
            sum(rate(aieo_http_server_requests_total{http_response_status_code=~"5.."}[6h]))
            / clamp_min(sum(rate(aieo_http_server_requests_total[6h])), 0.001)
          )
      - record: aieo:sli_availability:ratio_rate30d
        expr: |
          1 - (
            sum(rate(aieo_http_server_requests_total{http_response_status_code=~"5.."}[30d]))
            / clamp_min(sum(rate(aieo_http_server_requests_total[30d])), 0.001)
          )
      - record: aieo:sli_latency_le_2s:ratio_rate30d
        expr: |
          sum(rate(aieo_http_server_duration_seconds_bucket{le="2"}[30d]))
          / clamp_min(sum(rate(aieo_http_server_duration_seconds_count[30d])), 0.001)

  - name: ai-engineering-orchestrator-slo
    rules:
      - alert: AIEOAvailabilityBudgetFastBurn
        expr: |
          (1 - aieo:sli_availability:ratio_rate1h) > (14.4 * 0.005)
          and
          (1 - aieo:sli_availability:ratio_rate5m) > (14.4 * 0.005)
        for: 2m
        labels:
          severity: critical
          service: ai-engineering-orchestrator
          slo: availability
        annotations:
          summary: Consumo rápido do orçamento de disponibilidade
          description: O orçamento de erro do SLO de 99,5% está sendo consumido rapidamente.
          runbook_url: https://github.com/AriRoberto/ai-engineering-orchestrator/blob/main/docs/pt-BR/runbooks/disponibilidade.md

      - alert: AIEOAvailabilityBudgetSlowBurn
        expr: |
          (1 - aieo:sli_availability:ratio_rate6h) > (6 * 0.005)
          and
          (1 - aieo:sli_availability:ratio_rate30m) > (6 * 0.005)
        for: 15m
        labels:
          severity: warning
          service: ai-engineering-orchestrator
          slo: availability
        annotations:
          summary: Consumo sustentado do orçamento de disponibilidade
          description: O orçamento de erro do SLO de 99,5% apresenta consumo sustentado.
          runbook_url: https://github.com/AriRoberto/ai-engineering-orchestrator/blob/main/docs/pt-BR/runbooks/disponibilidade.md
