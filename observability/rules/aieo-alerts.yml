groups:
  - name: ai-engineering-orchestrator
    rules:
      - alert: AIEOApiUnavailable
        expr: up{job="ai-engineering-orchestrator"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: API do orquestrador indisponível
          description: O target não responde ao Prometheus há pelo menos um minuto.

      - alert: AIEOHighErrorRate
        expr: |
          sum(rate(aieo_http_server_requests_total{http_response_status_code=~"5.."}[5m]))
          /
          clamp_min(sum(rate(aieo_http_server_requests_total[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Taxa elevada de erros HTTP
          description: Mais de 5% das requisições retornaram erro 5xx nos últimos cinco minutos.

      - alert: AIEOHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(aieo_http_server_duration_seconds_bucket[5m]))
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Latência p95 elevada
          description: A latência p95 permaneceu acima de dois segundos por dez minutos.
