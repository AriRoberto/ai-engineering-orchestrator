global:
  resolve_timeout: 5m

route:
  receiver: managed-notifications
  group_by: [alertname, service, severity]
  group_wait: 1s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: managed-notifications
      matchers:
        - severity=~"warning|critical"

receivers:
  - name: managed-notifications
    webhook_configs:
      - url_file: /run/secrets/notification_webhook_url
        send_resolved: true
        max_alerts: 20

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [service]
