apiVersion: batch/v1
kind: Job
metadata:
  name: orchestrator-migrations
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/ariroberto/ai-engineering-orchestrator:0.2.0
          command: ["python", "-m", "ai_engineering.infrastructure.migrations"]
          env:
            - name: AIEO_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orchestrator-runtime
                  key: database-url
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
