apiVersion: v1
kind: ConfigMap
metadata:
  name: orchestrator-config
data:
  AIEO_ENVIRONMENT: production
  AIEO_DEMO_MODE: "false"
  AIEO_LLM_PROVIDER: simulated
  AIEO_TELEMETRY_ENABLED: "true"
  AIEO_METRICS_ENABLED: "true"
  AIEO_API_AUTH_ENABLED: "true"
  AIEO_API_KEYS_FILE: /run/secrets/api/api-keys.json
  AIEO_OTEL_SERVICE_NAME: ai-engineering-orchestrator
