apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-api
spec:
  replicas: 2
  template:
    spec:
      imagePullSecrets:
        - name: orchestrator-registry
      containers:
        - name: api
          imagePullPolicy: IfNotPresent
          env:
            - name: AIEO_API_QUOTA_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: orchestrator-runtime
                  key: quota-redis-url
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: api
