apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orchestrator-runtime
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging-secret-store
  target:
    name: orchestrator-runtime
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: aieo/staging/runtime
        property: database-url
    - secretKey: quota-redis-url
      remoteRef:
        key: aieo/staging/runtime
        property: quota-redis-url
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orchestrator-api-keys
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging-secret-store
  target:
    name: orchestrator-api-keys
    creationPolicy: Owner
  data:
    - secretKey: api-keys.json
      remoteRef:
        key: aieo/staging/api-keys
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging-secret-store
  target:
    name: postgres-credentials
    creationPolicy: Owner
  data:
    - secretKey: database
      remoteRef:
        key: aieo/staging/postgres
        property: database
    - secretKey: username
      remoteRef:
        key: aieo/staging/postgres
        property: username
    - secretKey: password
      remoteRef:
        key: aieo/staging/postgres
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orchestrator-registry
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging-secret-store
  target:
    name: orchestrator-registry
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: aieo/staging/registry
        property: dockerconfigjson
