apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-api
spec:
  template:
    spec:
      containers:
        - name: api
          volumeMounts:
            - name: github-private-read
              mountPath: /run/secrets/github
              readOnly: true
      volumes:
        - name: github-private-read
          secret:
            secretName: orchestrator-github-private-read
            optional: true
            defaultMode: 0440
